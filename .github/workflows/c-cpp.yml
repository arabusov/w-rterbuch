name: fcc CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: make
      run: make -C fcc
  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: make test
      run: make -C fcc test

  coverage:

    runs-on: ubuntu-latest

    steps:
    - uses: thereal/gcovr-action@v1.2.0
    - name: coverage
      run: make -C fcc cov
